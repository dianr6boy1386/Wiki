{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <div class="d-flex align-items-center justify-content-between">
        <h1>{{ title }}</h1>
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'edit_entry' title %}">Edit</a>
    </div>

    <div class="mt-3">
        {{ content|safe }}
    </div>
{% endblock %}

{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create New Page
{% endblock %}

{% block body %}
    <h1>Create New Page</h1>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form action="{% url 'create_entry' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="title">Title</label>
            <input class="form-control" id="title" type="text" name="title" value="{{ title_value|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="content">Content (Markdown)</label>
            <textarea class="form-control" id="content" name="content" rows="10" required>{{ content_value|default:'' }}</textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
    </form>
{% endblock %}
